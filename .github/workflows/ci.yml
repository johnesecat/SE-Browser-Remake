name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No package.json here: the test scripts run on plain Node with no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # rust-toolchain.toml pins the channel and the wasm target; rustup honours it.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium

      # Builds both renderer artifacts and fails the job on the Brotli first-load
      # and wasm budgets. The site is served from the repository root on Pages.
      - run: bash tools/build-web.sh /

      - run: bash tools/ci-test.sh

      - run: bash tools/package-site.sh dist _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
