[package]
name = "collateral-game"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
  "std", "async_executor", "bevy_asset", "bevy_log", "bevy_color",
  "bevy_window", "bevy_winit", "bevy_render", "bevy_camera", "bevy_mesh",
  "bevy_shader", "bevy_image", "bevy_light", "bevy_material", "bevy_pbr",
  "bevy_core_pipeline", "web", "touch"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "HtmlElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["x11"] }
